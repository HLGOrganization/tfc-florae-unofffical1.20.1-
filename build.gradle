buildscript {
    repositories {
        // Local first: works around very slow module downloads from forge maven.
        mavenLocal()
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {

        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

plugins {
    id 'java-library'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archive_name
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://modmaven.dev' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    flatDir { dirs 'libs' }
    // 本地 maven：放只有 dev 才需要的生产 jar（见依赖区的 withTFE 说明）。已在 .gitignore 中。
    maven {
        name = 'LocalDevLibs'
        url = uri("${projectDir}/devlibs")
        content { includeGroup 'tfe' }
    }
    mavenCentral()
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // TerraFirmaCraft 1.20.1 (this is the single most important dependency)
    implementation fg.deobf("maven.modrinth:terrafirmacraft:${tfc_version}")

    // Optional compile-only integrations
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:15.2.0.21")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:15.2.0.21")

    // Patchouli 是 TFC 的强制依赖。开发环境里 TFC 会因为缺它直接拒绝启动，
    // 但生产 jar 是混淆过的，直接丢进 run/mods 会 NoSuchFieldError，
    // 必须由 ForgeGradle 重新映射成 deobf 版本才可用。
    // 用 -PwithPatchouli 开关控制：默认构建（含 --offline）完全不受影响。
    if (project.hasProperty('withPatchouli')) {
        runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-84.1-FORGE")
    }

    // 本模组 data/tfc/worldgen/** 下的矿脉、漂砾、world_preset 覆盖文件引用了 TFE 的岩石
    // （tfe:rock/raw/tuff 等）。目标整合包里有 TFE，所以运行时没问题；但开发环境没有它，
    // 数据包注册表会加载失败。这里把本地 mods 里的 TFE 生产 jar 挂成本地 maven，
    // 由 ForgeGradle 反混淆后只在 dev 运行时加载。
    // 同样用 -PwithTFE 开关控制，默认构建不受影响。devlibs/ 已在 .gitignore 中。
    if (project.hasProperty('withTFE')) {
        runtimeOnly fg.deobf("tfe:Wildfire_TerraFirmaEarth:1.20.1-forge-2.3.0")
    }
}

// 需要的最小 Mixin：仅一个 @Accessor，用来把本模组的木材追加进 TFC 的旋转方块实体
// 白名单（BlockEntityType.validBlocks）。这与 ArborFirmaCraft 的做法完全一致
// （afc.mixins.json -> BlockEntityTypeAccessor）。
mixin {
    add sourceSets.main, "tfcflorae.refmap.json"
    config "tfcflorae.mixins.json"
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : mod_name,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : mod_name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

// The port ships ~100k resource files; a plain zip caps out at 65535 entries.
tasks.withType(Jar).configureEach {
    zip64 = true

    // Never ship editor backups / working files that end up in the resource tree.
    exclude '**/*.bak'
    exclude '**/*.bbmodel'
    exclude '**/*.orig'
    exclude '**/*.tmp'
}
